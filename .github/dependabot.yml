version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # wait a week before proposing a new release
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # minor and patch updates in one pull request; major updates one by one
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
