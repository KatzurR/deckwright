name: Bug report
description: Something in Deckwright does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Security problems belong in a private report, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the SRD catalog
        2. Add "Fireball" to a new deck
        3. Click "Print & export …" and choose "PDF sheets"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, if you run it from a clone.
  - type: dropdown
    id: languages
    attributes:
      label: Languages
      options:
        - English interface, English cards
        - English interface, German cards
        - German interface, English cards
        - German interface, German cards
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, deck file or console output
      description: You can attach a small deck file (.deckwright.json) that shows the problem.
  - type: checkboxes
    id: content
    attributes:
      label: Content
      options:
        - label: My report and its attachments contain no rules content other than the SRD 5.2.1.
          required: true
