name: Feature request
description: Suggest an idea or an improvement for Deckwright.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could Deckwright help? Sketches and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: content
    attributes:
      label: Content
      options:
        - label: The request needs no rules content other than the SRD 5.2.1 and no trademarks.
          required: true
